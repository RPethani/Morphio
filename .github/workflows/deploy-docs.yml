name: Deploy Documentation

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the `main` branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          npm install

      - name: Generate TypeDoc documentation
        run: |
          npm run docs  # Run the docs generation script

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}  # Use the GitHub token secret for authentication
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git checkout --orphan gh-pages  # Create a new gh-pages branch without history

          # Remove all files from the branch except the docs directory
          git ls-files | grep -v '^docs/' | xargs git rm -f  # Exclude docs/ folder from removal

          # Copy the generated documentation from docs/ folder to the root of the branch
          cp -r docs/* .

          git add .  # Stage the changes for commit
          git commit -m "Deploy documentation"  # Commit the deployed documentation

          # Push using GitHub Token
          git push --force --set-upstream https://github.com/${{ github.repository }} gh-pages
